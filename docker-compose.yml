services:
  # ─────────────────── Infrastructure ───────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: alitheia-postgres
    restart: unless-stopped
    ports:
      - "5431:5432"
    environment:
      POSTGRES_USER: alitheia
      POSTGRES_PASSWORD: alitheia_secret
      POSTGRES_DB: alitheia
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alitheia -d alitheia"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: alitheia-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─────────────────── Application ───────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: alitheia-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    # Same variables as local dev: GEMINI_API_KEY, GEMINI_MODEL, NINEROUTER_API_KEY,
    # NINEROUTER_MODEL, MAX_TRAINING_DATA_ROWS, EXTERNAL_TIMEOUT_MS, ... come from
    # the project's .env. Values under `environment:` below take precedence, so
    # host-only addresses in .env (localhost) are replaced with Docker-network ones.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://alitheia:alitheia_secret@postgres:5432/alitheia?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "${JWT_SECRET:-alitheia-dev-secret-key-change-in-production-min-32-chars}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000},http://localhost:3001"
      TRAINING_CSV_PATH: "/app/data/Data_latih.csv"
      # `localhost` inside the container is the container itself. To reach a 9Router
      # running on the host, use host.docker.internal (mapped below for Linux).
      # Override with DOCKER_NINEROUTER_BASE_URL in .env if needed.
      NINEROUTER_BASE_URL: "${DOCKER_NINEROUTER_BASE_URL:-http://host.docker.internal:20128/v1}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  # Media worker (yt-dlp / Whisper / OCR).
  # Opt-in: `docker compose --profile worker up -d`.
  #
  # Not started by default because it does not run in `npm run dev` either, and
  # its analysis step is still a stub (verdict "unverified", confidence 0). It
  # consumes the same Redis queue (alitheia:jobs) the API pushes social-media
  # links to, so when running it can overwrite the API's real results and mark
  # checks failed (e.g. YouTube is not in its ALLOWED_PLATFORMS).
  worker:
    profiles: ["worker"]
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: alitheia-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://alitheia:alitheia_secret@postgres:5432/alitheia"
      REDIS_URL: "redis://redis:6379"
      STORAGE_LOCAL_PATH: "/tmp/alitheia"
      STORAGE_TTL_HOURS: "24"
      MAX_DOWNLOAD_MB: "200"
      MAX_VIDEO_SECONDS: "600"
      DOWNLOAD_TIMEOUT_SECONDS: "60"
      ALLOWED_PLATFORMS: "instagram,tiktok,twitter,x.com"
      STT_MODEL_SIZE: "${STT_MODEL_SIZE:-small}"
      OCR_LANGUAGES: "ind,eng"
      OCR_MIN_CONFIDENCE: "0.5"
      OCR_MAX_FRAMES: "30"
    volumes:
      - worker_storage:/tmp/alitheia
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # Baked into the client bundle at build time (see Dockerfile.web).
        # Must be an address the BROWSER can reach.
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:5000}"
    container_name: alitheia-web
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  worker_storage:
    driver: local
