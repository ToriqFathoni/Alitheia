services:
  # ─────────────────── Infrastructure ───────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: alitheia-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: alitheia
      POSTGRES_PASSWORD: alitheia_secret
      POSTGRES_DB: alitheia
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alitheia -d alitheia"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: alitheia-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─────────────────── Application ───────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: alitheia-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://alitheia:alitheia_secret@postgres:5432/alitheia?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "${JWT_SECRET:-alitheia-dev-secret-key-change-in-production-min-32-chars}"
      CORS_ORIGINS: "http://localhost:3000"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      FACTCHECK_API_KEY: "${FACTCHECK_API_KEY:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: alitheia-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://alitheia:alitheia_secret@postgres:5432/alitheia"
      REDIS_URL: "redis://redis:6379"
      STORAGE_LOCAL_PATH: "/tmp/alitheia"
      STORAGE_TTL_HOURS: "24"
      MAX_DOWNLOAD_MB: "200"
      MAX_VIDEO_SECONDS: "600"
      DOWNLOAD_TIMEOUT_SECONDS: "60"
      ALLOWED_PLATFORMS: "instagram,tiktok,twitter,x.com"
      STT_MODEL_SIZE: "${STT_MODEL_SIZE:-small}"
      OCR_LANGUAGES: "ind,eng"
      OCR_MIN_CONFIDENCE: "0.5"
      OCR_MAX_FRAMES: "30"
    volumes:
      - worker_storage:/tmp/alitheia
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: alitheia-web
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: 3000
      NEXT_PUBLIC_API_URL: "http://localhost:5000"
    depends_on:
      - api

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  worker_storage:
    driver: local
